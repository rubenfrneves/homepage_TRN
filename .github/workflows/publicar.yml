# Cria no GitHub o ficheiro .github/workflows/publicar.yml com este conteúdo.
# Refaz e publica o site sempre que o conteúdo (content/) ou o gerador muda.
name: Publicar site
on:
  push:
    branches: [main]
    paths: ['TRN-propostas-A-B_gerador/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar o site
        run: |
          python3 TRN-propostas-A-B_gerador/gerar.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
